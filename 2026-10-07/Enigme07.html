<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/MUG-logo.webp">
    <link rel="stylesheet" href="style/style07.css">
    <title>7 Octobre 2026: Panique</title>
    <script src="scripts/script07.js" defer></script>
    <script src="style/style07.css"></script>
</head>
<body>
    <div class="colonne">
        <div class="blocTimer">
            <div class="LEDvalides">
                <img class="LED" id="LEDclignote0" src="images/LEDclignoteOFF.webp"></img>
                <p id="timer">5</p>
                <img class="LED" id="LEDclignote1" src="images/LEDclignoteOFF.webp"></img>
            </div>
            <div class="LEDvalides">
                <img class="LED" id="LEDvalide0" src="images/LEDvalideOFF.webp"></img>
                <img class="LED" id="LEDvalide1" src="images/LEDvalideOFF.webp"></img>
                <img class="LED" id="LEDvalide2" src="images/LEDvalideOFF.webp"></img>
            </div>
        </div>
        <div class="enigmes">
            <div class="enigme01">
                <div class="symboleScurseurs">
                    <div class="symboleCurseurs">
                        <img id="symboleCurseur0" src="images/symbole0.webp"></img>
                        <p id="symboleValeur0"></p>
                    </div>
                    <div class="symboleCurseurs">
                        <img id="symboleCurseur1" src="images/symbole1.webp"></img>
                        <p id="symboleValeur1"></p>
                    </div>
                    <div class="symboleCurseurs">
                        <img id="symboleCurseur2" src="images/symbole2.webp"></img>
                        <p id="symboleValeur2"></p>
                    </div>
                    <div class="symboleCurseurs">
                        <img id="symboleCurseur3" src="images/symbole3.webp"></img>
                        <p id="symboleValeur3"></p>
                    </div>
                    <div class="symboleCurseurs">
                        <img id="symboleCurseur4" src="images/symbole4.webp"></img>
                        <p id="symboleValeur4"></p>
                    </div>
                </div>
                <div class="symboleScurseurs2">
                    <div class="symboleCurseurs2">
                        <img id="symboleCurseurIN1" src=""></img>
                        <img id="symboleCurseurIN2" src=""></img>
                    </div>
                    <p id="curseurValeur"></p>
                    <input type="range" id="curseur" min="0" max="10"></input>
                    <button class="valider">
                    Valider
                    </button>
                </div>
            </div>
            <div class="enigme02">
                <div class="ligneSymboles">
                    <img id="symboleLigne0" src="images/symbole0.webp"></img>
                    <img class="fleche" src="images/fleche.png"></img>
                    <img id="symboleLigne1" src="images/symbole1.webp"></img>
                    <img class="fleche" src="images/fleche.png"></img>
                    <img id="symboleLigne2" src="images/symbole2.webp"></img>
                    <img class="fleche" src="images/fleche.png"></img>
                    <img id="symboleLigne3" src="images/symbole3.webp"></img>
                    <img class="fleche" src="images/fleche.png"></img>
                    <img id="symboleLigne4" src="images/symbole4.webp"></img>
                </div>
                <div class="fullBoitier">
                    <img id="boitier" src="images/BoiteFils.webp"></img>
                    <img id="symboleBoitier0" src="images/symbole0.webp"></img>
                    <img id="symboleBoitier1" src="images/symbole1.webp"></img>
                    <img id="symboleBoitier2" src="images/symbole2.webp"></img>

                    <img id="filBoitier0" src="images/Fil0.webp"></img>
                    <img id="filBoitier1" src="images/Fil1.webp"></img>
                    <img id="filBoitier2" src="images/Fil2.webp"></img>
                </div>
            </div>
            <div class="enigme03">
                <div class="LEDligne">
                    <img class="LEDenigme" id="LEDrouge0" src="images/LEDclignoteOFF.webp"></img>
                    <img class="LEDenigme" id="LEDrouge1" src="images/LEDclignoteOFF.webp"></img>
                </div>
                <div class="LEDligne">
                    <img class="LEDenigme" id="LEDrouge2" src="images/LEDclignoteOFF.webp"></img>
                    <img class="LEDenigme" id="LEDrouge3" src="images/LEDclignoteOFF.webp"></img>
                </div>
            </div>
        </div>
        <div>
            <button class="recommencer">
            Recommencer
            </button>
            <button class="reessayer">
            Réessayer
            </button>
        </div>

    </div>

</html>
